# Public chat API: first line of defence before Flask's own limits.
# (This file is included at http level, where these zones must live.)
limit_req_zone  $binary_remote_addr zone=chat_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=chat_conn:10m;

# HTTP — redirect all traffic to HTTPS, except for ACME cert challenges
server {
    listen 80;
    server_name ai.burn.codes;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl;
    server_name ai.burn.codes;

    ssl_certificate     /etc/letsencrypt/live/ai.burn.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.burn.codes/privkey.pem;

    # Modern SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Increase timeouts for long-running AI/crawl requests
    proxy_connect_timeout   60s;
    proxy_send_timeout      120s;
    proxy_read_timeout      120s;

    # Public chat endpoints (widget + public test page). Bursts allow a page
    # load plus polling; connection cap stops one IP from holding many long polls.
    location /api/chat/ {
        limit_req  zone=chat_api burst=30 nodelay;
        limit_conn chat_conn 20;
        limit_req_status  429;
        limit_conn_status 429;

        proxy_pass http://backend:5000/api/chat/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large file uploads
        client_max_body_size 100M;
    }

    # Chat page — embedded as an iframe by widget.js on customer sites, so it
    # must be frameable from any origin. add_header here replaces (not extends)
    # the server-level headers, hence the repeats.
    location /chat/ {
        proxy_pass http://frontend:80/chat/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Shared conversations, served by the dashboard app at their old address
    location /share/ {
        proxy_pass http://frontend:80/share/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Dashboard (static files via frontend container)
    location = /dashboard {
        return 301 /dashboard/$is_args$args;
    }
    location /dashboard/ {
        proxy_pass http://frontend:80/dashboard/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex" always;
    }

    # The dashboard's addresses from before it moved: bookmarks, Stripe sessions
    location ~ ^/(login|signup|manage-tenants|tenant|settings|onboarding|profile|subscription|preview\.html)(/|$) {
        return 301 /dashboard$request_uri;
    }

    # Landing page. "?onboarding" links open the guided setup in the dashboard.
    location = / {
        if ($args ~ "(^|&)onboarding(=|&|$)") {
            return 302 /dashboard/?$args;
        }
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
    }
}
