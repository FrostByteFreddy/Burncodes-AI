# SPA config: the build sits under /dashboard/; all unknown routes fall back to
# its index.html for Vue Router (including /chat and /share, which keep their addresses)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Serve static assets directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes -> index.html (Vue Router handles them)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /dashboard/index.html;
    }
}
