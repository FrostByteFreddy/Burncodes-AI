name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  # release.yml runs these same checks before deploying a tag
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/services/api/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        run: pip install -r services/api/requirements.txt -r requirements-test.txt
      - name: Compile all services
        run: python -m compileall -q services shared
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Fail on high-severity advisories
        run: npm audit --audit-level=high
